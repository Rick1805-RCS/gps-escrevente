<script>
    const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbxVOmQWo4KpU2K7orqzMoldU4ptLvGMc6azdtgjS9PUzXLeBy--cC11sZw3yBdsBrEu1Q/exec";

    const revBase = () => ({ 
        rev1: { concluida: false, data: "", certo: 0, errado: 0 }, 
        rev2: { concluida: false, data: "", certo: 0, errado: 0 }, 
        rev3: { concluida: false, data: "", certo: 0, errado: 0 } 
    });

    let dadosEstudo = {
        portugues: [
            { id: "pt1", materia: "Português", assunto: "Interpretação e Compreensão de Texto", tema_artigos: "Fatores de Textualidade e Inferências", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "pt2", materia: "Português", assunto: "Sinal Indicativo de Crase", tema_artigos: "Casos Obrigatórios, Proibidos e Facultativos", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "pt3", materia: "Português", assunto: "Regência Verbal e Nominal", tema_artigos: "Sintaxe de Regência", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "pt4", materia: "Português", assunto: "Concordância Verbal e Nominal", tema_artigos: "Regras Gerais e Especiais", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "pt5", materia: "Português", assunto: "Pontuação", tema_artigos: "Vírgula, Dois Pontos e Travessão", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "pt6", materia: "Português", assunto: "Colocação Pronominal", tema_artigos: "Próclise, Mesóclise e Ênclise", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ],
        direito: [
            { id: "dp1", materia: "Direito Penal", assunto: "Crimes Contra a Fé Pública", tema_artigos: "Arts. 293 a 305", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "dp2", materia: "Direito Penal", assunto: "Falsa Identidade", tema_artigos: "Arts. 307 e 308", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "dpp1", materia: "Direito Processual Penal", assunto: "Sujeitos e Auxiliares", tema_artigos: "Arts. 251 a 258, 261 a 267 e 274", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "dpc1", materia: "Direito Processual Civil", assunto: "Impedimento e Suspeição", tema_artigos: "Arts. 144 a 155", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "dco1", materia: "Direito Constitucional", assunto: "Direitos e Deveres Individuais e Coletivos", tema_artigos: "Art. 5º", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "dad1", materia: "Direito Administrativo", assunto: "Estatuto dos Funcionários Públicos (SP)", tema_artigos: "Lei 10.261/68, Arts. 239 a 323", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "nco1", materia: "Normas da Corregedoria", assunto: "Escrituração, Protocolo e Carga de Autos", tema_artigos: "Tomo I - Cap. III - Seções I, II, V, VI, VII", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ],
        rlm: [
            { id: "rlm1", materia: "RLM", assunto: "Sequências Lógicas", tema_artigos: "Números, Letras, Palavras e Figuras", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "rlm2", materia: "RLM", assunto: "Equivalências Lógicas e Negações", tema_artigos: "Proposições Compostas", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ],
        matematica: [
            { id: "mat1", materia: "Matemática", assunto: "Proporcionalidade", tema_artigos: "Regra de Três Simples/Composta e Porcentagem", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "mat2", materia: "Matemática", assunto: "Razão, Proporção e Divisão", tema_artigos: "Divisão Proporcional", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ],
        informatica: [
            { id: "inf1", materia: "Informática", assunto: "MS-Excel", tema_artigos: "SOMA, SE, PROCV, CONT.SE e Endereçamento", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" },
            { id: "inf2", materia: "Informática", assunto: "MS-Word", tema_artigos: "Formatação, Quebras, Tabelas", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ],
        atualidades: [
            { id: "atu1", materia: "Atualidades", assunto: "Estatuto da Pessoa com Deficiência", tema_artigos: "Lei 13.146/15 - Arts. 1º a 13 e 34 a 38", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: revBase(), obs: "" }
        ]
    };

    let gradeCicloCustom = [
        { id: 1, dia: "Segunda", tempo: 2, tipo: "teoria", materia: "Língua Portuguesa", desc: "" },
        { id: 2, dia: "Segunda", tempo: 2, tipo: "teoria", materia: "Direito Constitucional", desc: "" },
        { id: 6, dia: "Terça", tempo: 2, tipo: "teoria", materia: "Direito Administrativo", desc: "" },
        { id: 9, dia: "Terça", tempo: 2, tipo: "teoria", materia: "Direito Processual Civil", desc: "" },
        { id: 11, dia: "Quarta", tempo: 2, tipo: "teoria", materia: "Direito Penal", desc: "" },
        { id: 14, dia: "Quarta", tempo: 2, tipo: "teoria", materia: "Direito Processual Penal", desc: "" },
        { id: 16, dia: "Quinta", tempo: 2, tipo: "teoria", materia: "Normas da Corregedoria", desc: "" },
        { id: 19, dia: "Quinta", tempo: 2, tipo: "teoria", materia: "Informática", desc: "" },
        { id: 21, dia: "Sexta", tempo: 2, tipo: "teoria", materia: "Matemática", desc: "" },
        { id: 24, dia: "Sexta", tempo: 2, tipo: "teoria", materia: "R. Lógico", desc: "" },
        { id: 26, dia: "Sábado", tempo: 2, tipo: "teoria", materia: "Atualidades", desc: "" },
        { id: 29, dia: "Sábado", tempo: 2, tipo: "revisao-teorica", materia: "Revisão Geral", desc: "da teoria estudada na semana" },
        { id: 30, dia: "Domingo", tempo: 4, tipo: "revisao-questoes", materia: "Revisão Objetiva", desc: "questões erradas da semana" }
    ];

    let acervoTemasVunesp = ["Desafios do trabalho na era da IA", "Limites da liberdade de expressão", "Envelhecimento da população", "Mobilidade Urbana Sustentável"];
    let redacaoData = { intro: "", dev1: "", dev2: "", concl: "" };

    // --- FUNÇÃO DE MIGRAÇÃO DE DADOS (PREVINE TRAVAMENTOS) ---
    function garantirEstruturaDados() {
        ['portugues', 'direito', 'rlm', 'matematica', 'informatica', 'atualidades'].forEach(mat => {
            if(!dadosEstudo[mat]) dadosEstudo[mat] = [];
            dadosEstudo[mat].forEach((item, index) => {
                if(!item.id) item.id = mat + Date.now() + index;
                if(!item.revisoes) item.revisoes = revBase();
                if(!item.tema_artigos) item.tema_artigos = "Assunto Base (Dados Antigos)";
                if(!item.recorrencia) item.recorrencia = item.prioridade === 'alta' ? 'Alta' : 'Média';
                if(item.certo === undefined) item.certo = 0;
                if(item.errado === undefined) item.errado = 0;
                if(item.finalizado === undefined) item.finalizado = false;
            });
        });
    }

    // --- UI E TOAST ---
    function showToast(msg) {
        const toast = document.getElementById('toast-msg');
        toast.innerText = msg; toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function toggleTema() { document.body.classList.toggle('dark-mode'); agendarSalvamentoNuvem(); }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if (tabId === 'evolucao') renderGraficoEvolucao();
    }

    // --- GERAÇÃO DE TABELAS ---
    function getCorRecorrencia(rec) {
        const r = rec.toLowerCase();
        if(r.includes('alta')) return 'rec-alta';
        if(r.includes('baixa')) return 'rec-baixa';
        return 'rec-media';
    }

    function gerarHtmlTabela(materiaKey, dadosArray) {
        if (!dadosArray || dadosArray.length === 0) return `<div style="padding: 20px; text-align: center;">Nenhum assunto.</div>`;
        
        let html = `<table><thead><tr>
            <th>Assunto e Artigos</th>
            <th style="width: 90px; text-align: center;">Recorrência</th>
            <th style="width: 200px; text-align: center;">Desempenho Geral</th>
            <th style="width: 320px;">Acompanhamento / Revisões</th>
            <th style="width: 30px;"></th>
        </tr></thead><tbody>`;

        dadosArray.forEach((item) => {
            const totalGeral = item.certo + item.errado;
            const pctGeral = totalGeral > 0 ? Math.round((item.certo / totalGeral) * 100) : 0;
            let pctClassG = pctGeral >= 80 ? 'pct-good' : (pctGeral < 60 && totalGeral > 0 ? 'pct-bad' : 'pct-mid');
            const recClass = getCorRecorrencia(item.recorrencia);

            html += `<tr id="row-${materiaKey}-${item.id}">
                <td data-label="Assunto">
                    <div class="txt-materia-destaque">${item.assunto} <button class="btn-del-row" style="font-size: 0.7rem;" onclick="editarTexto('${materiaKey}', '${item.id}', 'assunto')">✏️</button></div>
                    <div class="txt-artigos">${item.tema_artigos} <button class="btn-del-row" style="font-size: 0.7rem;" onclick="editarTexto('${materiaKey}', '${item.id}', 'tema_artigos')">✏️</button></div>
                </td>
                <td data-label="Recorrência" style="text-align: center;">
                    <span class="badge-recorrencia ${recClass}" onclick="editarTexto('${materiaKey}', '${item.id}', 'recorrencia')" style="cursor:pointer;">${item.recorrencia}</span>
                </td>
                <td data-label="Desempenho Geral">
                    <div style="display:flex; gap:6px; justify-content:center; align-items:center;">
                        <div style="text-align:center; font-size:0.7rem; font-weight:800; color:var(--text-muted);">C<br><input type="number" value="${item.certo}" onchange="atualizarCampo('${materiaKey}', '${item.id}', 'certo', this.value)"></div>
                        <div style="text-align:center; font-size:0.7rem; font-weight:800; color:var(--text-muted);">E<br><input type="number" value="${item.errado}" onchange="atualizarCampo('${materiaKey}', '${item.id}', 'errado', this.value)"></div>
                        <div style="text-align:center; font-size:0.7rem; font-weight:800; color:var(--text-muted);">Total<br><input type="text" class="input-total-readonly" readonly value="${totalGeral}" id="totalGeral-${item.id}"></div>
                        <div style="margin-left: 5px;"><span class="pct-badge ${pctClassG}" id="pctGeral-${item.id}">${pctGeral}%</span></div>
                    </div>
                </td>
                <td data-label="Revisões">
                    <div class="rev-container">
                        <label class="estudo-fin" style="color: ${item.finalizado ? 'var(--btn-salvar)' : 'inherit'};">
                            <input type="checkbox" ${item.finalizado ? 'checked' : ''} onchange="atualizarCampo('${materiaKey}', '${item.id}', 'finalizado', this.checked)"> ESTUDO FINALIZADO
                        </label>
                        ${['rev1', 'rev2', 'rev3'].map((r, i) => {
                            const rev = item.revisoes[r] || {concluida: false, data: "", certo: 0, errado: 0};
                            const revTotal = (rev.certo || 0) + (rev.errado || 0);
                            return `
                            <div class="rev-item">
                                <label><input type="checkbox" ${rev.concluida ? 'checked' : ''} onchange="atualizarRevisao('${materiaKey}', '${item.id}', '${r}', 'concluida', this.checked)"> R${i+1}</label>
                                <input type="text" class="input-dt" placeholder="DD/MM/AA" value="${rev.data}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', '${r}', 'data', this.value)">
                                <span class="rev-lbl">C:</span> <input type="number" class="input-num-sm" value="${rev.certo \vert{}\vert{} 0}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', '${r}', 'certo', this.value)">
                                <span class="rev-lbl">E:</span> <input type="number" class="input-num-sm" value="${rev.errado \vert{}\vert{} 0}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', '${r}', 'errado', this.value)">
                                <span class="rev-lbl">T:</span> <span class="rev-total" id="total-${r}-${item.id}">${revTotal}</span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </td>
                <td style="text-align: center;"><button class="btn-del-row" onclick="excluirAssunto('${materiaKey}', '${item.id}')">🗑️</button></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        return html;
    }

    function renderTodasTabelas() {
        garantirEstruturaDados(); // Força formatação antes de desenhar
        renderTabelaDireito();
        document.getElementById('table-portugues').innerHTML = gerarHtmlTabela('portugues', dadosEstudo.portugues);
        document.getElementById('table-rlm').innerHTML = gerarHtmlTabela('rlm', dadosEstudo.rlm);
        document.getElementById('table-matematica').innerHTML = gerarHtmlTabela('matematica', dadosEstudo.matematica);
        document.getElementById('table-informatica').innerHTML = gerarHtmlTabela('informatica', dadosEstudo.informatica);
        document.getElementById('table-atualidades').innerHTML = gerarHtmlTabela('atualidades', dadosEstudo.atualidades);
    }

    function renderTabelaDireito() {
        const ramo = document.getElementById('select-ramo-direito').value;
        const dados = ramo === 'todos' ? dadosEstudo.direito : dadosEstudo.direito.filter(d => d.materia === ramo);
        document.getElementById('table-direito').innerHTML = gerarHtmlTabela('direito', dados);
    }

    // --- LÓGICA DE DADOS (AUTO-SAVE) ---
    let debounceTimer;
    function agendarSalvamentoNuvem() {
        redacaoData = {
            intro: document.getElementById('red-intro')?.value || "",
            dev1: document.getElementById('red-dev1')?.value || "",
            dev2: document.getElementById('red-dev2')?.value || "",
            concl: document.getElementById('red-concl')?.value || ""
        };

        const backupLocal = { estudo: dadosEstudo, ciclo: gradeCicloCustom, temas: acervoTemasVunesp, redacao: redacaoData };
        localStorage.setItem('gps_escrevente_data_v2', JSON.stringify(backupLocal));
        
        const btn = document.getElementById('btn-status-nuvem');
        btn.innerText = "Sincronizando..."; btn.style.background = "#f59e0b";
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { executarSalvamentoNuvem(backupLocal); }, 3000);
    }

    function atualizarCampo(materia, id, campo, valor) {
        const item = dadosEstudo[materia].find(i => i.id === id);
        if (!item) return;
        if (campo === 'certo' || campo === 'errado') {
            item[campo] = parseInt(valor) || 0;
            const total = item.certo + item.errado;
            const pct = total > 0 ? Math.round((item.certo / total) * 100) : 0;
            
            const boxTotal = document.getElementById(`totalGeral-${id}`);
            const badge = document.getElementById(`pctGeral-${id}`);
            if(boxTotal) boxTotal.value = total;
            if(badge) {
                badge.innerText = `${pct}%`;
                badge.className = `pct-badge ${pct >= 80 ? 'pct-good' : (pct < 60 && total > 0 ? 'pct-bad' : 'pct-mid')}`;
            }
        } else {
            item[campo] = valor;
            if(campo === 'finalizado') {
                const row = document.getElementById(`row-${materia}-${id}`);
                if(row) row.querySelector('.estudo-fin').style.color = valor ? 'var(--btn-salvar)' : 'inherit';
            }
        }
        agendarSalvamentoNuvem();
    }

    function atualizarRevisao(materia, id, revKey, campo, valor) {
        const item = dadosEstudo[materia].find(i => i.id === id);
        if(item && item.revisoes[revKey]) {
            if(campo === 'certo' || campo === 'errado') {
                item.revisoes[revKey][campo] = parseInt(valor) || 0;
                const c = item.revisoes[revKey].certo || 0;
                const e = item.revisoes[revKey].errado || 0;
                const spanTot = document.getElementById(`total-${revKey}-${id}`);
                if(spanTot) spanTot.innerText = c + e;
            } else {
                item.revisoes[revKey][campo] = valor;
            }
            agendarSalvamentoNuvem();
        }
    }

    function editarTexto(mat, id, campo) {
        const item = dadosEstudo[mat].find(i => i.id === id);
        let novo = prompt(`Editar:`, item[campo]);
        if (novo !== null && novo.trim() !== "") { item[campo] = novo.trim(); renderTodasTabelas(); agendarSalvamentoNuvem(); }
    }
    function excluirAssunto(mat, id) {
        if (confirm("Excluir este assunto?")) { dadosEstudo[mat] = dadosEstudo[mat].filter(i => i.id !== id); renderTodasTabelas(); agendarSalvamentoNuvem(); showToast("Excluído!"); }
    }

    // --- NUVEM ---
    async function executarSalvamentoNuvem(dadosParaSalvar) {
        const email = document.getElementById('email-aluno').value.trim();
        const btn = document.getElementById('btn-status-nuvem');
        if (!email || !email.includes('@')) { btn.innerText = "⚠️ E-mail ausente"; return; }
        try {
            const payload = { email: email, dados: dadosParaSalvar || { estudo: dadosEstudo, ciclo: gradeCicloCustom, temas: acervoTemasVunesp, redacao: redacaoData } };
            const response = await fetch(URL_PLANILHA, { method: 'POST', body: JSON.stringify(payload) });
            const parsed = await response.json();
            if (parsed.status === "success") { btn.innerText = "☁️ Nuvem Sincronizada"; btn.style.background = "var(--btn-salvar)"; }
        } catch (e) { btn.innerText = "⚠️ Erro Sincronização"; btn.style.background = "var(--accent-red)"; }
    }

    function salvarNuvemManual() { clearTimeout(debounceTimer); executarSalvamentoNuvem(); showToast("Forçando Sincronização..."); }

    function preencherDadosMemoria(data) {
        if (data.estudo) dadosEstudo = data.estudo;
        if (data.ciclo) gradeCicloCustom = data.ciclo;
        if (data.temas) acervoTemasVunesp = data.temas;
        if (data.redacao) {
            redacaoData = data.redacao;
            if(document.getElementById('red-intro')) document.getElementById('red-intro').value = redacaoData.intro || "";
            if(document.getElementById('red-dev1')) document.getElementById('red-dev1').value = redacaoData.dev1 || "";
            if(document.getElementById('red-dev2')) document.getElementById('red-dev2').value = redacaoData.dev2 || "";
            if(document.getElementById('red-concl')) document.getElementById('red-concl').value = redacaoData.concl || "";
            if(typeof calcularPalavrasRedacao === 'function') calcularPalavrasRedacao();
        }
    }

    async function iniciarSessao() {
        const email = document.getElementById('modal-input-email').value.trim();
        if (!email) return;
        document.getElementById('btn-modal-acessar').innerText = "A carregar...";
        
        try {
            try {
                const response = await fetch(URL_PLANILHA, { method: 'POST', body: JSON.stringify({ action: "load", email: email, sheet: "Dados" }) });
                const parsed = await response.json();
                if (parsed.status === "success" && parsed.data) {
                    preencherDadosMemoria(parsed.data);
                }
            } catch (e) {
                const local = localStorage.getItem('gps_escrevente_data_v2') || localStorage.getItem('gps_escrevente_model_data_v7');
                if (local) preencherDadosMemoria(JSON.parse(local));
            }
        } finally {
            // Oculta sempre a tela independente de erro de dados
            localStorage.setItem('gps_email_usuario', email);
            document.getElementById('email-aluno').value = email;
            document.getElementById('modal-acesso').style.display = 'none';
            
            renderTodasTabelas(); 
            renderCicloTable();
        }
    }

    window.onload = () => {
        const emailSalvo = localStorage.getItem('gps_email_usuario');
        if (emailSalvo) { document.getElementById('modal-input-email').value = emailSalvo; iniciarSessao(); }
    };

    // --- FUNÇÕES DOS MÓDULOS RESTAURADOS ---
    function getMateriaColorClass(materia) {
        const m = materia.toLowerCase();
        if (m.includes('português')) return 'bg-mat-portugues'; if (m.includes('processual penal')) return 'bg-mat-proc-penal';
        if (m.includes('penal')) return 'bg-mat-penal'; if (m.includes('processual civil')) return 'bg-mat-proc-civil';
        if (m.includes('constitucional')) return 'bg-mat-const'; if (m.includes('administrativo')) return 'bg-mat-admin';
        if (m.includes('normas')) return 'bg-mat-normas'; if (m.includes('r. lógico') || m.includes('rlm')) return 'bg-mat-rlm';
        if (m.includes('matemática')) return 'bg-mat-matematica'; if (m.includes('informática')) return 'bg-mat-info';
        if (m.includes('atualidades')) return 'bg-mat-atualidades'; if (m.includes('revisão')) return 'bg-mat-revisao';
        return 'bg-mat-descanso';
    }
    function getBadgeText(tipo, tempo) {
        const hrsStr = tempo && tempo > 0 ? `${tempo}h ` : '';
        switch(tipo) { case 'teoria': return `${hrsStr}TEORIA`; case 'questoes': return `${hrsStr}QUESTÕES`; case 'revisao-teorica': return `${hrsStr}REVISÃO`; case 'revisao-questoes': return `${hrsStr}REVISÃO`; case 'descanso': return 'DESCANSO'; default: return tipo.toUpperCase(); }
    }
    function renderCicloTable() {
        ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"].forEach(dia => {
            const col = document.getElementById(`col-${dia}`);
            if (!col) return;
            let html = '';
            gradeCicloCustom.filter(x => x.dia === dia).forEach(item => {
                const colorClass = getMateriaColorClass(item.materia);
                html += `<div class="ciclo-card-slot"><button class="btn-del-row" style="position: absolute; top: 1px; right: 2px; font-size: 0.6rem;" onclick="removerSlotCiclo(${item.id})">🗑️</button><span class="badge-tipo-neutral">${getBadgeText(item.tipo, item.tempo)}</span><div class="slot-materia-destaque ${colorClass}">${item.materia}</div>${item.desc ? `<div class="slot-desc">${item.desc}</div>` : ''}</div>`;
            });
            col.innerHTML = html;
        });
    }
    function adicionarSlotCiclo() {
        gradeCicloCustom.push({ id: Date.now(), dia: document.getElementById('ciclo-dia').value, tempo: parseInt(document.getElementById('ciclo-tempo').value) || 0, tipo: document.getElementById('ciclo-tipo').value, materia: document.getElementById('ciclo-materia-select').value, desc: document.getElementById('ciclo-desc').value.trim() });
        document.getElementById('ciclo-desc').value = ''; renderCicloTable(); agendarSalvamentoNuvem();
    }
    function removerSlotCiclo(id) { gradeCicloCustom = gradeCicloCustom.filter(x => x.id !== id); renderCicloTable(); agendarSalvamentoNuvem(); }

    let timerInterval, seconds = 0, timerRunning = false;
    function iniciarTimer() { if (!timerRunning) { timerRunning = true; timerInterval = setInterval(() => { seconds++; if(document.getElementById('timer')) document.getElementById('timer').innerText = new Date(seconds * 1000).toISOString().substr(11, 8); }, 1000); } }
    function pausarTimer() { timerRunning = false; clearInterval(timerInterval); }
    function zerarTimer() { pausarTimer(); seconds = 0; if(document.getElementById('timer')) document.getElementById('timer').innerText = "00:00:00"; }
    
    let temaAtualTexto = "";
    function sortearTema() { 
        if(acervoTemasVunesp.length === 0) return;
        temaAtualTexto = acervoTemasVunesp[Math.floor(Math.random() * acervoTemasVunesp.length)];
        if(document.getElementById('display-tema')) document.getElementById('display-tema').innerHTML = `<b>Tema Atual:</b> ${temaAtualTexto}`; 
    }
    function excluirTemaAtual() {
        if(!temaAtualTexto) return;
        acervoTemasVunesp = acervoTemasVunesp.filter(t => t !== temaAtualTexto);
        temaAtualTexto = ""; if(document.getElementById('display-tema')) document.getElementById('display-tema').innerHTML = `<b>Tema Atual:</b> Tema removido.`; agendarSalvamentoNuvem();
    }

    function mudarModoGlobal(modo) {
        ['intro', 'dev1', 'dev2', 'concl'].forEach(b => {
            const ta = document.getElementById(`red-${b}`);
            if(!ta) return;
            if (modo === 'caderno') { ta.classList.remove('modo-digitacao'); ta.classList.add('modo-caderno'); } else { ta.classList.remove('modo-caderno'); ta.classList.add('modo-digitacao'); }
        });
    }
    function mudarFonteGlobal(fonte) {
        ['intro', 'dev1', 'dev2', 'concl'].forEach(b => {
            const ta = document.getElementById(`red-${b}`);
            if(!ta) return;
            if (fonte === 'cursiva') { ta.classList.remove('fonte-forma'); ta.classList.add('fonte-cursiva'); } else { ta.classList.remove('fonte-cursiva'); ta.classList.add('fonte-forma'); }
        });
    }
    function calcularPalavrasRedacao() {
        if(!document.getElementById('red-intro')) return;
        const textoCompleto = `${document.getElementById('red-intro').value} ${document.getElementById('red-dev1').value} ${document.getElementById('red-dev2').value} ${document.getElementById('red-concl').value}`.trim();
        const palavras = textoCompleto ? textoCompleto.split(/\s+/).length : 0;
        if(document.getElementById('info-contagem')) document.getElementById('info-contagem').innerText = `Total: ${palavras} palavras (~${Math.round(palavras / 9)} linhas)`;
    }
    function exportarTXT() {
        if(!document.getElementById('red-intro')) return;
        const blob = new Blob([`REDAÇÃO - TJSP\n\n1. INTRODUÇÃO:\n${document.getElementById('red-intro').value}\n\n2. DESENVOLVIMENTO 1:\n${document.getElementById('red-dev1').value}\n\n3. DESENVOLVIMENTO 2:\n${document.getElementById('red-dev2').value}\n\n4. CONCLUSÃO:\n${document.getElementById('red-concl').value}`], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Redacao_Treino.txt"; a.click();
    }
    function copiarPromptGemini() {
        if(!document.getElementById('red-intro')) return;
        const p = `Avalie a redação abaixo com rigor da VUNESP para Escrevente Técnico Judiciário.\nTema: "${temaAtualTexto || 'Livre'}"\n\nTexto:\n1. Intro:\n${document.getElementById('red-intro').value}\n\n2. Dev 1:\n${document.getElementById('red-dev1').value}\n\n3. Dev 2:\n${document.getElementById('red-dev2').value}\n\n4. Conclusão:\n${document.getElementById('red-concl').value}`;
        navigator.clipboard.writeText(p).then(() => alert("Copiado! Cole no Gemini."));
    }

    let chartObj = null;
    function renderGraficoEvolucao() {
        const ctx = document.getElementById('chartEvolucao');
        if (!ctx) return;
        const labels = ['Português', 'D. Penal', 'D. Proc. Penal', 'D. Proc. Civil', 'D. Const.', 'D. Admin.', 'RLM', 'Informática'];
        const sumData = (arr) => arr.reduce((acc, curr) => acc + (curr.certo/(curr.certo+curr.errado || 1)), 0) / (arr.length||1) * 100;
        const data = [
            sumData(dadosEstudo.portugues), sumData(dadosEstudo.direito.filter(x => x.materia === "Direito Penal")),
            sumData(dadosEstudo.direito.filter(x => x.materia === "Direito Processual Penal")), sumData(dadosEstudo.direito.filter(x => x.materia === "Direito Processual Civil")),
            sumData(dadosEstudo.direito.filter(x => x.materia === "Direito Constitucional")), sumData(dadosEstudo.direito.filter(x => x.materia === "Direito Administrativo")),
            sumData(dadosEstudo.rlm), sumData(dadosEstudo.informatica)
        ];
        if(chartObj) chartObj.destroy();
        chartObj = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: '% Média de Acerto', data: data, backgroundColor: '#3b82f6' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 100 } } } });
    }
</script>
