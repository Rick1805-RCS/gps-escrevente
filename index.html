<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Escrevente - TJSP</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            color: var(--secondary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Progresso das Matérias */
        .subject-group {
            margin-bottom: 20px;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-bg {
            background-color: #e0e0e0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background-color: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }
        
        button.reset {
            background-color: #e74c3c;
        }

        /* Área de Redação/Discursiva */
        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        textarea {
            flex-grow: 1;
            min-height: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #ecf0f1;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>GPS Escrevente</h1>
        <p>Painel de Controle e Prática</p>
    </header>

    <div class="dashboard">
        <!-- Coluna Esquerda: Progresso -->
        <div class="card">
            <h2>Edital - Progresso</h2>
            <div id="subjects-container"></div>
            <button class="reset" onclick="resetProgress()" style="margin-top: 20px; width: 100%;">Zerar Progresso</button>
        </div>

        <!-- Coluna Direita: Prática de Redação -->
        <div class="card editor-container">
            <h2>Prática de Escrita</h2>
            <textarea id="essay-editor" placeholder="Digite sua redação ou resumo de jurisprudência aqui..."></textarea>
            <div class="stats-bar">
                <span id="char-count">0 Caracteres</span>
                <span id="word-count">0 Palavras</span>
                <button onclick="clearEditor()">Limpar Texto</button>
            </div>
        </div>
    </div>

    <script>
        // Configuração inicial das matérias baseadas no edital VUNESP
        const defaultSubjects = [
            { id: 'portugues', name: 'Língua Portuguesa', progress: 0 },
            { id: 'penal', name: 'Direito Penal', progress: 0 },
            { id: 'processo-penal', name: 'Direito Processual Penal', progress: 0 },
            { id: 'constitucional', name: 'Direito Constitucional', progress: 0 },
            { id: 'administrativo', name: 'Direito Administrativo', progress: 0 },
            { id: 'informatica', name: 'Informática', progress: 0 },
            { id: 'raciocinio', name: 'Raciocínio Lógico', progress: 0 }
        ];

        // Carrega dados do LocalStorage ou usa o padrão
        let subjects = JSON.parse(localStorage.getItem('gpsEscreventeSubjects')) || defaultSubjects;

        // Renderiza as barras de progresso
        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';

            subjects.forEach(subject => {
                const div = document.createElement('div');
                div.className = 'subject-group';
                div.innerHTML = `
                    <div class="subject-header">
                        <span>${subject.name}</span>
                        <span id="pct-${subject.id}">${subject.progress}%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="fill-${subject.id}" style="width: ${subject.progress}%"></div>
                    </div>
                    <div class="controls">
                        <button onclick="updateProgress('${subject.id}', -5)">-5%</button>
                        <button onclick="updateProgress('${subject.id}', 5)">+5%</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Atualiza e salva o progresso
        function updateProgress(id, change) {
            const subject = subjects.find(s => s.id === id);
            if (subject) {
                subject.progress += change;
                // Mantém entre 0 e 100
                if (subject.progress > 100) subject.progress = 100;
                if (subject.progress < 0) subject.progress = 0;
                
                // Atualiza DOM
                document.getElementById(`pct-${id}`).innerText = `${subject.progress}%`;
                document.getElementById(`fill-${id}`).style.width = `${subject.progress}%`;
                
                // Salva
                localStorage.setItem('gpsEscreventeSubjects', JSON.stringify(subjects));
            }
        }

        function resetProgress() {
            if(confirm("Tem certeza que deseja zerar todo o progresso do edital?")) {
                subjects = JSON.parse(JSON.stringify(defaultSubjects));
                localStorage.setItem('gpsEscreventeSubjects', JSON.stringify(subjects));
                renderSubjects();
            }
        }

        // --- Lógica do Editor de Redação ---
        const editor = document.getElementById('essay-editor');
        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');

        // Carrega texto salvo
        editor.value = localStorage.getItem('gpsEscreventeEssay') || '';
        updateStats();

        // Atualiza contadores e salva automaticamente
        editor.addEventListener('input', () => {
            updateStats();
            localStorage.setItem('gpsEscreventeEssay', editor.value);
        });

        function updateStats() {
            const text = editor.value;
            const chars = text.length;
            // Conta palavras ignorando espaços em branco extras
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            
            charCount.innerText = `${chars} Caracteres`;
            wordCount.innerText = `${words} Palavras`;
        }

        function clearEditor() {
            if(confirm("Deseja apagar o texto atual?")) {
                editor.value = '';
                updateStats();
                localStorage.removeItem('gpsEscreventeEssay');
            }
        }

        // Inicialização
        renderSubjects();
    </script>
</body>
</html>
