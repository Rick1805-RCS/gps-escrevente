<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Escrevente — TJSP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f4f6f9;
            --bg-header: #1b2431;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary-blue: #3b82f6;
            --btn-salvar: #10b981;
            --btn-exportar: #4b5563;
            --btn-importar: #4f46e5;
            --btn-resetar: #ef4444;
            --border-color: #cbd5e1;
        }

        body.dark-mode {
            --bg-page: #0f172a;
            --bg-header: #1e293b;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #334155;
            --primary-blue: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); padding-bottom: 20px; }

        /* Notificações Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-header);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(20px);
            pointer-events: none;
            z-index: 10000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* Modal de Acesso */
        #modal-acesso {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }
        .modal-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 12px; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
        }
        .modal-card h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 8px; }
        .modal-card input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-weight: 700; margin-bottom: 15px; background: var(--bg-page); color: var(--text-main); text-align: center; }
        .modal-card button { width: 100%; padding: 10px; border: none; background: var(--btn-salvar); color: white; font-weight: 800; border-radius: 6px; cursor: pointer; }

        .header-bar { background-color: var(--bg-header); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .btn-hdr { border: none; padding: 6px 12px; border-radius: 4px; color: white; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: opacity 0.2s; }
        .btn-hdr:hover { opacity: 0.8; }
        .btn-tema { background: #475569; }
        .btn-salvar { background: var(--btn-salvar); }
        .btn-exportar { background: var(--btn-exportar); }
        .btn-importar { background: var(--btn-importar); }
        .btn-resetar { background: var(--btn-resetar); }

        .nav-container { padding: 0 15px; margin-top: 10px; }
        .nav-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border-color); overflow-x: auto; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: transparent; border: none; padding: 10px 15px; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); cursor: pointer; border-radius: 6px 6px 0 0; white-space: nowrap; flex: 1; text-align: center; }
        .tab-btn.active { background: var(--primary-blue); color: #ffffff; }

        .main-container { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; margin-bottom: 15px; }

        .subfilter-bar { background: #f1f5f9; padding: 10px 15px; border-bottom: 1px solid var(--border-color); }
        body.dark-mode .subfilter-bar { background: #0f172a; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #e2e8f0; color: #0f172a; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--border-color); }
        body.dark-mode th { background: #0f172a; color: #f8fafc; }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; vertical-align: middle; }
        
        .txt-materia { font-weight: 800; color: var(--primary-blue); font-size: 0.85rem; }
        .txt-artigos { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; }
        .badge-recorrencia { font-size: 0.7rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #334155; }
        body.dark-mode .badge-recorrencia { background: #334155; color: #cbd5e1; }

        input[type="number"] { width: 50px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; text-align: center; font-weight: 700; background: var(--bg-page); color: var(--text-main); }
        input[type="date"] { padding: 2px 4px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.7rem; background: var(--bg-page); color: var(--text-main); }
        input[type="text"] { width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-page); color: var(--text-main); }

        .pct-badge { font-weight: 800; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; display: inline-block; min-width: 45px; text-align: center;}
        .pct-good { background: rgba(16,185,129,0.2); color: #047857; }
        .pct-mid { background: rgba(245,158,11,0.2); color: #b45309; }
        .pct-bad { background: rgba(239,68,68,0.2); color: #b91c1c; }

        .rev-box { display: flex; flex-direction: column; gap: 6px; }
        .rev-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; }
        .check-finalizado { transform: scale(1.3); margin-right: 8px; accent-color: var(--btn-salvar); cursor: pointer; }

        .btn-acao { background: transparent; border: none; cursor: pointer; font-size: 0.9rem; opacity: 0.7; }
        .btn-acao:hover { opacity: 1; }

        /* Media Queries para Responsividade (Telemóvel/Tablet) */
        @media (max-width: 768px) {
            table thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tr { margin-bottom: 15px; background: var(--bg-page); border: 2px solid var(--border-color); border-radius: 8px; padding: 8px; }
            td { text-align: right; padding: 8px 0; border-bottom: 1px dashed var(--border-color); display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
            td:last-child { border-bottom: none; }
            td::before { content: attr(data-label); font-weight: 800; color: var(--primary-blue); text-transform: uppercase; font-size: 0.7rem; width: 100%; text-align: left; margin-bottom: 4px; }
            
            .header-actions { justify-content: center; width: 100%; }
            .header-actions input { width: 100% !important; margin-bottom: 5px; }
            .nav-tabs { justify-content: flex-start; }
            .tab-btn { flex: 0 0 auto; }
            
            .rev-row { width: 100%; justify-content: space-between; }
        }

        /* Estilos adicionais para módulos (Redação, Evolução, Ciclo) mantidos do original, adaptados para CSS Grid */
        .panel-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .panel-card h3 { font-size: 1rem; color: var(--text-main); font-weight: 800; margin-bottom: 10px; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .grid-2col { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Notificação Toast -->
    <div id="toast-msg" class="toast"></div>

    <!-- Modal Inicial de Autenticação -->
    <div id="modal-acesso">
        <div class="modal-card">
            <h2>Olá, Ricardo!</h2>
            <p>Sincronize ou insira o seu e-mail de acesso:</p>
            <input type="email" id="modal-input-email" placeholder="seu-email@exemplo.com">
            <button id="btn-modal-acessar" onclick="iniciarSessao()">Carregar GPS Escrevente</button>
        </div>
    </div>

    <header class="header-bar">
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3L4 6V12C4 16.97 7.41 21.5 12 22C16.59 21.5 20 16.97 20 12V6L12 3Z" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
              <path d="M12 5V7M12 15V17M6 11H8M16 11H18" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <h1>GPS Escrevente</h1>
        </div>
        <div class="header-actions">
            <input type="email" id="email-aluno" placeholder="E-mail de Sincronização" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.78rem; font-weight: bold; width: 200px; background: var(--bg-page); color: var(--text-main);">
            <button class="btn-hdr btn-tema" onclick="toggleTema()">🌙 Tema</button>
            <button class="btn-hdr btn-salvar" id="btn-status-nuvem" onclick="salvarNuvemManual()">☁️ Forçar Sincronização</button>
            <button class="btn-hdr btn-exportar" onclick="exportarBackup()">📤 Backup Local</button>
            <input type="file" id="file-input" style="display:none;" onchange="importarBackup(event)">
            <button class="btn-hdr btn-exportar" onclick="document.getElementById('file-input').click()">📥 Importar</button>
            <button class="btn-hdr btn-resetar" onclick="resetarDados()">🗑️ Resetar</button>
        </div>
    </header>

    <nav class="nav-container">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('direito')">⚖️ Direito</button>
            <button class="tab-btn" onclick="switchTab('portugues')">📘 Português</button>
            <button class="tab-btn" onclick="switchTab('exatas')">🧮 RLM & Mat</button>
            <button class="tab-btn" onclick="switchTab('gerais')">💻 Info & Atual</button>
            <button class="tab-btn" onclick="switchTab('evolucao')">📊 Evolução</button>
        </div>
    </nav>

    <main class="main-container">
        
        <!-- DIREITO -->
        <div id="direito" class="tab-content active">
            <div class="table-card">
                <div class="subfilter-bar">
                    <select id="select-ramo-direito" onchange="renderTabelaDireito()" style="padding: 6px; border-radius: 4px; font-weight: 700; width: 100%; max-width: 300px;">
                        <option value="todos">Todos os Ramos do Direito</option>
                        <option value="Direito Penal">Direito Penal</option>
                        <option value="Direito Processual Penal">Direito Processual Penal</option>
                        <option value="Direito Processual Civil">Direito Processual Civil</option>
                        <option value="Direito Constitucional">Direito Constitucional</option>
                        <option value="Direito Administrativo">Direito Administrativo</option>
                        <option value="Normas da Corregedoria">Normas da Corregedoria</option>
                    </select>
                </div>
                <div id="table-direito"></div>
            </div>
            <div class="panel-card">
                <h3>➕ Adicionar Novo Assunto</h3>
                <div class="grid-2col" style="grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end;">
                    <div>
                        <label style="font-size:0.75rem; font-weight:800;">Ramo:</label>
                        <select id="add-ramo-dir" style="width:100%; padding:6px; border-radius:4px;">
                            <option value="Direito Penal">Direito Penal</option>
                            <option value="Direito Processual Penal">Direito Processual Penal</option>
                            <option value="Direito Processual Civil">Direito Processual Civil</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:800;">Assunto Geral:</label>
                        <input type="text" id="add-assunto-dir" placeholder="Ex: Crimes Contra a Fé Pública">
                    </div>
                    <div>
                        <label style="font-size:0.75rem; font-weight:800;">Artigos / Detalhe:</label>
                        <input type="text" id="add-artigos-dir" placeholder="Ex: Arts. 293 a 305">
                    </div>
                    <button class="btn-hdr btn-salvar" style="padding: 8px 15px;" onclick="addAssunto('direito')">Adicionar</button>
                </div>
            </div>
        </div>

        <!-- PORTUGUÊS -->
        <div id="portugues" class="tab-content">
            <div class="table-card"><div id="table-portugues"></div></div>
        </div>

        <!-- EXATAS -->
        <div id="exatas" class="tab-content">
            <h3 style="margin-bottom:10px; color:var(--primary-blue);">Raciocínio Lógico</h3>
            <div class="table-card"><div id="table-rlm"></div></div>
            <h3 style="margin-bottom:10px; color:var(--primary-blue);">Matemática</h3>
            <div class="table-card"><div id="table-matematica"></div></div>
        </div>

        <!-- GERAIS -->
        <div id="gerais" class="tab-content">
            <h3 style="margin-bottom:10px; color:var(--primary-blue);">Informática</h3>
            <div class="table-card"><div id="table-informatica"></div></div>
            <h3 style="margin-bottom:10px; color:var(--primary-blue);">Atualidades</h3>
            <div class="table-card"><div id="table-atualidades"></div></div>
        </div>

        <!-- EVOLUÇÃO (Mantida estrutura base) -->
        <div id="evolucao" class="tab-content">
            <div class="panel-card">
                <h3>📈 Evolução de Acertos</h3>
                <div style="height: 300px;"><canvas id="chartEvolucao"></canvas></div>
            </div>
        </div>

    </main>

    <script>
        // URL do Google Apps Script (Mantenha a sua URL)
        const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbxVOmQWo4KpU2K7orqzMoldU4ptLvGMc6azdtgjS9PUzXLeBy--cC11sZw3yBdsBrEu1Q/exec";

        // Modelo Base para gerar Revisões
        const baseRevisoes = () => ({
            rev1: { concluida: false, data: "" },
            rev2: { concluida: false, data: "" },
            rev3: { concluida: false, data: "" }
        });

        // Nova Estrutura de Dados
        let dadosEstudo = {
            direito: [
                { id: "dp1", materia: "Direito Penal", assunto: "Crimes Contra a Fé Pública", tema_artigos: "Falsidade Ideológica (Art. 299) e Uso de Doc. Falso (Art. 304)", recorrencia: "Muito Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" },
                { id: "dp2", materia: "Direito Penal", assunto: "Crimes Praticados por Func. Público", tema_artigos: "Peculato, Concussão, Corrupção Passiva (Arts. 312 a 317)", recorrencia: "Muito Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" },
                { id: "dpp1", materia: "Direito Processual Penal", assunto: "Citações e Intimações", tema_artigos: "Regras Gerais e Prazos (Arts. 351 a 372)", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" },
                { id: "dpc1", materia: "Direito Processual Civil", assunto: "Tutela Provisória", tema_artigos: "Urgência e Evidência (Arts. 294 a 311)", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ],
            portugues: [
                { id: "pt1", materia: "Português", assunto: "Sintaxe e Concordância", tema_artigos: "Verbal e Nominal, Regência e Crase", recorrencia: "Muito Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" },
                { id: "pt2", materia: "Português", assunto: "Compreensão de Texto", tema_artigos: "Inferências e Sentido Contextual", recorrencia: "Muito Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ],
            rlm: [
                { id: "rlm1", materia: "RLM", assunto: "Estruturas Lógicas", tema_artigos: "Equivalências e Negações (Tabela-Verdade)", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ],
            matematica: [
                { id: "mat1", materia: "Matemática", assunto: "Proporcionalidade", tema_artigos: "Regra de Três, Porcentagem e Juros", recorrencia: "Média", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ],
            informatica: [
                { id: "inf1", materia: "Informática", assunto: "Planilhas MS Excel", tema_artigos: "Fórmulas SE, PROCV e Referências Absolutas", recorrencia: "Muito Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ],
            atualidades: [
                { id: "atu1", materia: "Atualidades", assunto: "Estatuto da Pessoa com Deficiência", tema_artigos: "Arts. 1º a 13 e 34 a 38", recorrencia: "Alta", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: "" }
            ]
        };

        // --- SISTEMA DE TOAST E UI ---
        function showToast(mensagem) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = mensagem;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleTema() { 
            document.body.classList.toggle('dark-mode'); 
            agendarSalvamentoNuvem(); // Salva a pref visual
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'evolucao') renderGraficoEvolucao();
        }

        // --- MOTOR DE RENDERIZAÇÃO DE TABELAS (HTML Semântico e Responsivo) ---
        function gerarHtmlTabela(materiaKey, dadosArray) {
            if (dadosArray.length === 0) return `<div style="padding: 20px; text-align: center; color: var(--text-muted);">Nenhum assunto cadastrado.</div>`;
            
            let html = `<table><thead><tr>
                <th>Assunto e Artigos</th>
                <th style="width: 120px; text-align: center;">Recorrência</th>
                <th style="width: 180px; text-align: center;">Desempenho</th>
                <th style="width: 250px;">Acompanhamento / Revisões</th>
                <th style="width: 40px;"></th>
            </tr></thead><tbody>`;

            dadosArray.forEach((item, index) => {
                const totalQ = item.certo + item.errado;
                const pct = totalQ > 0 ? Math.round((item.certo / totalQ) * 100) : 0;
                const pctClass = pct >= 80 ? 'pct-good' : (pct < 60 && totalQ > 0 ? 'pct-bad' : 'pct-mid');

                html += `<tr id="row-${materiaKey}-${item.id}">
                    <td data-label="Assunto">
                        <div class="txt-materia">${item.assunto} <button class="btn-acao" onclick="editarTexto('${materiaKey}', '${item.id}', 'assunto')" title="Editar Assunto">✏️</button></div>
                        <div class="txt-artigos">${item.tema_artigos} <button class="btn-acao" onclick="editarTexto('${materiaKey}', '${item.id}', 'tema_artigos')" title="Editar Artigos">✏️</button></div>
                    </td>
                    <td data-label="Recorrência" style="text-align: center;">
                        <span class="badge-recorrencia" onclick="editarTexto('${materiaKey}', '${item.id}', 'recorrencia')" style="cursor:pointer;" title="Clique para editar">${item.recorrencia}</span>
                    </td>
                    <td data-label="Desempenho">
                        <div style="display:flex; gap:8px; justify-content:center; align-items:center;">
                            <div style="text-align:center; font-size:0.7rem; font-weight:800; color:var(--text-muted);">C<br><input type="number" value="${item.certo}" onchange="atualizarCampo('${materiaKey}', '${item.id}', 'certo', this.value)"></div>
                            <div style="text-align:center; font-size:0.7rem; font-weight:800; color:var(--text-muted);">E<br><input type="number" value="${item.errado}" onchange="atualizarCampo('${materiaKey}', '${item.id}', 'errado', this.value)"></div>
                            <span class="pct-badge ${pctClass}" id="pct-${item.id}">${pct}%</span>
                        </div>
                    </td>
                    <td data-label="Progresso e Revisões">
                        <div class="rev-box">
                            <label style="font-weight:800; color: ${item.finalizado ? 'var(--btn-salvar)' : 'var(--text-main)'}; display:flex; align-items:center;">
                                <input type="checkbox" class="check-finalizado" ${item.finalizado ? 'checked' : ''} onchange="atualizarCampo('${materiaKey}', '${item.id}', 'finalizado', this.checked)">
                                ESTUDO FINALIZADO
                            </label>
                            <div class="rev-row">
                                <label><input type="checkbox" ${item.revisoes.rev1.concluida ? 'checked' : ''} onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev1', 'concluida', this.checked)"> R1</label>
                                <input type="date" value="${item.revisoes.rev1.data}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev1', 'data', this.value)">
                            </div>
                            <div class="rev-row">
                                <label><input type="checkbox" ${item.revisoes.rev2.concluida ? 'checked' : ''} onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev2', 'concluida', this.checked)"> R2</label>
                                <input type="date" value="${item.revisoes.rev2.data}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev2', 'data', this.value)">
                            </div>
                            <div class="rev-row">
                                <label><input type="checkbox" ${item.revisoes.rev3.concluida ? 'checked' : ''} onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev3', 'concluida', this.checked)"> R3</label>
                                <input type="date" value="${item.revisoes.rev3.data}" onchange="atualizarRevisao('${materiaKey}', '${item.id}', 'rev3', 'data', this.value)">
                            </div>
                        </div>
                    </td>
                    <td style="text-align: center;"><button class="btn-acao" onclick="excluirAssunto('${materiaKey}', '${item.id}')" title="Excluir">🗑️</button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        function renderTodasTabelas() {
            renderTabelaDireito();
            document.getElementById('table-portugues').innerHTML = gerarHtmlTabela('portugues', dadosEstudo.portugues);
            document.getElementById('table-rlm').innerHTML = gerarHtmlTabela('rlm', dadosEstudo.rlm);
            document.getElementById('table-matematica').innerHTML = gerarHtmlTabela('matematica', dadosEstudo.matematica);
            document.getElementById('table-informatica').innerHTML = gerarHtmlTabela('informatica', dadosEstudo.informatica);
            document.getElementById('table-atualidades').innerHTML = gerarHtmlTabela('atualidades', dadosEstudo.atualidades);
        }

        function renderTabelaDireito() {
            const ramo = document.getElementById('select-ramo-direito').value;
            const dados = ramo === 'todos' ? dadosEstudo.direito : dadosEstudo.direito.filter(d => d.materia === ramo);
            document.getElementById('table-direito').innerHTML = gerarHtmlTabela('direito', dados);
        }

        // --- LÓGICA DE DADOS (Atualização Cirúrgica e Auto-Save) ---
        let debounceTimer;

        function agendarSalvamentoNuvem() {
            // Salva instantaneamente no LocalStorage para segurança
            localStorage.setItem('gps_escrevente_data', JSON.stringify(dadosEstudo));
            
            // UI Feedback
            const btn = document.getElementById('btn-status-nuvem');
            btn.innerText = "Sincronizando...";
            btn.style.background = "#f59e0b"; // Amarelo

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                executarSalvamentoNuvem();
            }, 3000); // Envia após 3 segundos sem digitar
        }

        function atualizarCampo(materia, id, campo, valor) {
            const item = dadosEstudo[materia].find(i => i.id === id);
            if (!item) return;

            if (campo === 'certo' || campo === 'errado') {
                item[campo] = parseInt(valor) || 0;
                // Atualiza DOM via ID para não recriar a tabela (evita perder foco do teclado)
                const total = item.certo + item.errado;
                const pct = total > 0 ? Math.round((item.certo / total) * 100) : 0;
                const badge = document.getElementById(`pct-${id}`);
                if(badge) {
                    badge.innerText = `${pct}%`;
                    badge.className = `pct-badge ${pct >= 80 ? 'pct-good' : (pct < 60 && total > 0 ? 'pct-bad' : 'pct-mid')}`;
                }
            } else {
                item[campo] = valor;
                if(campo === 'finalizado') {
                    // Reforça visualmente o label do checkbox
                    const row = document.getElementById(`row-${materia}-${id}`);
                    if(row) {
                        const lbl = row.querySelector('.check-finalizado').parentElement;
                        lbl.style.color = valor ? 'var(--btn-salvar)' : 'var(--text-main)';
                    }
                }
            }
            agendarSalvamentoNuvem();
        }

        function atualizarRevisao(materia, id, revisaoKey, campo, valor) {
            const item = dadosEstudo[materia].find(i => i.id === id);
            if(item && item.revisoes[revisaoKey]) {
                item.revisoes[revisaoKey][campo] = valor;
                agendarSalvamentoNuvem();
            }
        }

        function editarTexto(materia, id, campo) {
            const item = dadosEstudo[materia].find(i => i.id === id);
            let novo = prompt(`Editar ${campo.replace('_', ' ')}:`, item[campo]);
            if (novo !== null && novo.trim() !== "") {
                item[campo] = novo.trim();
                renderTodasTabelas(); // Texto estrutural compensa recriar a tabela
                agendarSalvamentoNuvem();
            }
        }

        function excluirAssunto(materia, id) {
            if (confirm("Excluir este assunto?")) {
                dadosEstudo[materia] = dadosEstudo[materia].filter(i => i.id !== id);
                renderTodasTabelas();
                agendarSalvamentoNuvem();
                showToast("Assunto excluído!");
            }
        }

        function addAssunto(materia) {
            // Adaptado para o formulário no HTML de Direito, mas pode ser expandido
            const ramo = document.getElementById('add-ramo-dir').value;
            const assunto = document.getElementById('add-assunto-dir').value.trim();
            const artigos = document.getElementById('add-artigos-dir').value.trim();
            
            if(!assunto) return showToast("Preencha o Assunto Geral!");

            dadosEstudo.direito.push({
                id: 'd' + Date.now(), materia: ramo, assunto: assunto, tema_artigos: artigos,
                recorrencia: "Nova", certo: 0, errado: 0, finalizado: false, revisoes: baseRevisoes(), obs: ""
            });

            document.getElementById('add-assunto-dir').value = '';
            document.getElementById('add-artigos-dir').value = '';
            renderTabelaDireito();
            agendarSalvamentoNuvem();
            showToast("Assunto Adicionado!");
        }

        // --- INTEGRAÇÃO COM NUVEM (Google Sheets) ---
        async function executarSalvamentoNuvem() {
            const email = document.getElementById('email-aluno').value.trim();
            const btn = document.getElementById('btn-status-nuvem');
            
            if (!email || !email.includes('@')) {
                btn.innerText = "⚠️ E-mail ausente"; btn.style.background = "var(--accent-red)";
                return;
            }

            try {
                const response = await fetch(URL_PLANILHA, {
                    method: 'POST',
                    body: JSON.stringify({ email: email, dados: { estudo: dadosEstudo } })
                });
                const parsed = await response.json();
                
                if (parsed.status === "success") {
                    btn.innerText = "☁️ Nuvem Sincronizada";
                    btn.style.background = "var(--btn-salvar)"; // Volta pro verde
                } else {
                    throw new Error("Erro acesso");
                }
            } catch (e) {
                btn.innerText = "⚠️ Erro Sincronização";
                btn.style.background = "var(--accent-red)";
            }
        }

        function salvarNuvemManual() {
            clearTimeout(debounceTimer);
            executarSalvamentoNuvem();
            showToast("Sincronização forçada iniciada.");
        }

        async function iniciarSessao() {
            const emailInput = document.getElementById('modal-input-email').value.trim();
            if (!emailInput || !emailInput.includes('@')) { return alert("E-mail inválido."); }

            const btn = document.getElementById('btn-modal-acessar');
            btn.innerText = "A carregar dados do seu PC/Tablet...";

            try {
                const response = await fetch(URL_PLANILHA, {
                    method: 'POST', body: JSON.stringify({ action: "load", email: emailInput, sheet: "Dados" })
                });
                const parsed = await response.json();

                if (parsed.status === "success" && parsed.data && parsed.data.estudo) {
                    dadosEstudo = parsed.data.estudo;
                    showToast("Dados sincronizados com sucesso!");
                } else {
                    showToast("Sessão iniciada localmente (Sem dados na nuvem).");
                }

                localStorage.setItem('gps_email_usuario', emailInput);
                document.getElementById('email-aluno').value = emailInput;
                document.getElementById('modal-acesso').style.display = 'none';
                renderTodasTabelas();

            } catch (e) {
                alert("Falha de rede. A carregar dados armazenados neste dispositivo.");
                const local = localStorage.getItem('gps_escrevente_data');
                if (local) dadosEstudo = JSON.parse(local);
                
                localStorage.setItem('gps_email_usuario', emailInput);
                document.getElementById('email-aluno').value = emailInput;
                document.getElementById('modal-acesso').style.display = 'none';
                renderTodasTabelas();
            }
        }

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            const emailSalvo = localStorage.getItem('gps_email_usuario');
            if (emailSalvo) {
                document.getElementById('modal-input-email').value = emailSalvo;
                iniciarSessao(); // Dispara o load transparente
            }
        };

        // --- Gráfico Básico (Adaptado para somatório) ---
        let chartObj = null;
        function renderGraficoEvolucao() {
            const ctx = document.getElementById('chartEvolucao');
            if (!ctx) return;
            const labels = ['Dir. Penal', 'Proc. Penal', 'Proc. Civil', 'Const.', 'Admin.', 'Normas', 'Português', 'Exatas', 'Gerais'];
            const sumData = (arr) => arr.reduce((acc, curr) => acc + (curr.certo/(curr.certo+curr.errado || 1)), 0) / (arr.length||1) * 100;
            
            const dp = dadosEstudo.direito.filter(x => x.materia === "Direito Penal");
            const dpp = dadosEstudo.direito.filter(x => x.materia === "Direito Processual Penal");
            const dpc = dadosEstudo.direito.filter(x => x.materia === "Direito Processual Civil");
            
            const data = [sumData(dp), sumData(dpp), sumData(dpc), 0, 0, 0, sumData(dadosEstudo.portugues), sumData(dadosEstudo.rlm), sumData(dadosEstudo.informatica)];

            if(chartObj) chartObj.destroy();
            chartObj = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: '% Acerto Médio', data: data, backgroundColor: '#3b82f6' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 100 } } }
            });
        }
    </script>
</body>
</html>
